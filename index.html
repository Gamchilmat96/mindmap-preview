<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><!-- 테스트용 공개 주소가 검색에 안 뜨게 -->
<title>소설 기획 지도</title>
<!-- 글꼴만 Google Fonts에서 받는다(작품 내용은 보내지 않는다). 인터넷이 없으면 기본 글꼴로 보인다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 디자인: "다꾸 스티커 공책" — 크림색 모눈종이 + 코코아색 굵은 테두리 + 번지지 않는 그림자 + 사탕색 파스텔.
   참고: Gumroad · 파스텔 네오브루탈리즘(굵은 테두리 · 흐림 없는 그림자), Duolingo(둥근 모양 · 눌리는 단추).
   글꼴: 화면 틀과 그림은 Jua(둥근 글꼴), 글 칸은 Gowun Dodum. 인터넷이 없으면 기본 글꼴로 보인다. */
:root {
  --bg: #fff4e4; --panel: #fffdf8; --paper: #fffaf1; --ink: #3b2f2f; --muted: #8b7a6f;
  --line: #3b2f2f; --soft-line: #efdac4; --grid: #f6e6d2; --rule: #f3e0cc; --margin: #ffa9c4;
  --shade: #3b2f2f;                                   /* 그림자 색(흐림 없음) */
  --sel: #ff4f93; --focus: #ff7aae;
  --pink: #ffd0e1; --pink-d: #f27aa6; --mint: #c4f1df; --mint-d: #3fb98c; --butter: #ffeaa6; --butter-d: #e9ad19;
  --lav: #e2d8ff; --lav-d: #8f78ec; --sky: #cfe8ff; --sky-d: #4fa3e3; --peach: #ffdcc4; --peach-d: #f5853d; --oat: #ece4d8; --oat-d: #9c8e80;
  /* 플롯 단계: 부 = 라벤더, 화 = 버터, 장면 = 민트, 세부 = 딸기 */
  --d0: #3b2f2f; --d0-ink: #fff6e9;
  --d1: var(--lav); --d2: var(--butter); --d3: var(--mint); --d4: var(--pink);
  --edge: #b9a593;
  /* 인물 색: c0은 첫 줄 인물(코코아) */
  --c0: #3b2f2f; --c0-line: #3b2f2f; --c0-ink: #fff6e9; --c0-sub: #e6d6c3;
  --c1: var(--pink); --c1-line: var(--pink-d); --c2: var(--sky); --c2-line: var(--sky-d); --c3: var(--mint); --c3-line: var(--mint-d);
  --c4: var(--butter); --c4-line: var(--butter-d); --c5: var(--lav); --c5-line: var(--lav-d); --c6: var(--peach); --c6-line: var(--peach-d); --c7: var(--oat); --c7-line: var(--oat-d);
  --plant: #e8652b; --plant-soft: var(--peach); --payoff: #16936a; --payoff-soft: var(--mint); --warn: #e23d68; --warn-soft: #ffd3df;
  --mochi: #ffffff; --cheek: #ffa3c2;
  --font-cute: "Jua", "BM JUA_OTF", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-text: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font: var(--font-text);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "D2Coding", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #231d2c; --panel: #2c2537; --paper: #2a2334; --ink: #f6ead8; --muted: #b9a9a0;
    --line: #f6ead8; --soft-line: #463b52; --grid: #2f2839; --rule: #3a3146; --margin: #7a3d58;
    --shade: #0e0b12; --sel: #ff6fa8; --focus: #ff8fbd;
    --pink: #6a3a55; --pink-d: #ff9cc2; --mint: #2c5a4b; --mint-d: #6fe0b4; --butter: #5f4e22; --butter-d: #ffd35c;
    --lav: #463b70; --lav-d: #b6a4ff; --sky: #2c4a6a; --sky-d: #7cc3ff; --peach: #6a4130; --peach-d: #ffab73; --oat: #4a4038; --oat-d: #cdbfb0;
    --d0: #f6ead8; --d0-ink: #231d2c; --edge: #6d5f66;
    --c0: #f6ead8; --c0-line: #f6ead8; --c0-ink: #231d2c; --c0-sub: #6d5f66;
    --plant: #ff9a5c; --payoff: #5fe0ad; --warn: #ff7096; --warn-soft: #5a2635;
    --mochi: #fff6ee; --cheek: #ff8fb5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #231d2c; --panel: #2c2537; --paper: #2a2334; --ink: #f6ead8; --muted: #b9a9a0;
  --line: #f6ead8; --soft-line: #463b52; --grid: #2f2839; --rule: #3a3146; --margin: #7a3d58;
  --shade: #0e0b12; --sel: #ff6fa8; --focus: #ff8fbd;
  --pink: #6a3a55; --pink-d: #ff9cc2; --mint: #2c5a4b; --mint-d: #6fe0b4; --butter: #5f4e22; --butter-d: #ffd35c;
  --lav: #463b70; --lav-d: #b6a4ff; --sky: #2c4a6a; --sky-d: #7cc3ff; --peach: #6a4130; --peach-d: #ffab73; --oat: #4a4038; --oat-d: #cdbfb0;
  --d0: #f6ead8; --d0-ink: #231d2c; --edge: #6d5f66;
  --c0: #f6ead8; --c0-line: #f6ead8; --c0-ink: #231d2c; --c0-sub: #6d5f66;
  --plant: #ff9a5c; --payoff: #5fe0ad; --warn: #ff7096; --warn-soft: #5a2635;
  --mochi: #fff6ee; --cheek: #ff8fb5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font);
  display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; overflow: hidden;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ── 떡 마스코트(떡밥이) ── */
.mochi .body { fill: #ffffff; stroke: var(--line); stroke-width: 2.2; }
.mochi .eye, .fish .eye { fill: #3b2f2f; }
.mochi .mouth { fill: none; stroke: #3b2f2f; stroke-width: 1.6; stroke-linecap: round; }
.mochi .cheek { fill: #ffa3c2; }
.mochi .leaf { fill: #5fcf9f; stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; }
.fish .body { fill: #bfe3ff; stroke: var(--line); stroke-width: 2.2; stroke-linejoin: round; }
.fish .fin { fill: #8ccaf5; stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; }
.qmark .body { fill: var(--warn-soft); stroke: var(--line); stroke-width: 2; }
.qmark text { font: 15px var(--font-cute); fill: var(--warn); }

/* ── 위쪽 막대 ── */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px;
  padding: 10px 16px; background: var(--panel); border-bottom: 2px solid var(--line); position: relative; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 8px; margin-right: 2px; }
.logo { width: 36px; height: 32px; flex: none; transform: rotate(-6deg); }
header h1 { font: 19px var(--font-cute); margin: 0; white-space: nowrap; letter-spacing: -.01em; }
.tag { font: 11px/18px var(--font-cute); color: var(--ink); background: var(--pink); border: 1.5px solid var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap; transform: rotate(4deg); }
.title-field { gap: 8px; white-space: nowrap; font-family: var(--font-cute); color: var(--muted); }
#site { width: var(--site-w, 150px); max-width: 42vw; font: 16px var(--font-cute); color: var(--ink); background: var(--paper); border: 2px dashed var(--soft-line); border-radius: 12px; padding: 4px 10px; }
#site:hover { border-color: var(--edge); }
#site:focus { border: 2px solid var(--line); background: var(--panel); outline: none; }
#site::placeholder { color: var(--muted); }
label { display: flex; align-items: center; gap: 6px; color: var(--muted); font: 13.5px var(--font-cute); white-space: nowrap; }
#plotBar { flex-wrap: wrap; row-gap: 6px; }
input, select { font: 14px var(--font-cute); color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 3px 8px; }
input:focus, select:focus { outline: none; box-shadow: 0 0 0 3px var(--pink); }
#target { width: 84px; }
#at { width: 64px; }
.group { display: flex; gap: 6px; align-items: center; }
.spacer { flex: 1; }
/* 단추: 굵은 테두리 + 아래로 3px 그림자, 누르면 쏙 들어간다 */
button, .menu > summary {
  font: 14px var(--font-cute); color: var(--ink); background: var(--panel);
  border: 2px solid var(--line); border-radius: 12px; padding: 4px 12px; cursor: pointer; white-space: nowrap;
  box-shadow: 0 3px 0 var(--shade); transition: transform .06s, box-shadow .06s;
}
button:hover, .menu > summary:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--shade); }
button:active, .menu > summary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shade); }
button:disabled { opacity: .38; cursor: default; transform: none; box-shadow: 0 3px 0 var(--shade); }
button.ghost { background: var(--paper); }

.tabs { display: flex; gap: 6px; padding: 0; }
.tabs button { font-size: 15px; padding: 5px 11px; background: var(--paper); color: var(--muted); box-shadow: none; border-color: var(--soft-line); }
.tabs button:hover { color: var(--ink); border-color: var(--line); box-shadow: 0 3px 0 var(--shade); }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--line); box-shadow: 0 3px 0 var(--shade); transform: translateY(-1px); }
.tabs button[data-mode="plot"][aria-selected="true"] { background: var(--butter); }
.tabs button[data-mode="cast"][aria-selected="true"] { background: var(--pink); }
.tabs button[data-mode="ledger"][aria-selected="true"] { background: var(--mint); }
.badge {
  display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 5px; border-radius: 10px; vertical-align: 1px;
  background: var(--sel); color: #fff; border: 1.5px solid var(--line); font: 11.5px/17px var(--font-cute); text-align: center;
}

/* "저장 · 복사" 메뉴 */
.menu { position: relative; }
.menu > summary { list-style: none; display: block; background: var(--pink); user-select: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu > summary::after { content: '▾'; margin-left: 6px; font-size: 11px; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 10px); z-index: 20; width: 300px; max-width: calc(100vw - 24px);
  background: var(--panel); border: 2px solid var(--line); border-radius: 16px; box-shadow: 5px 5px 0 var(--shade);
  padding: 8px; display: flex; flex-direction: column; gap: 2px;
}
.menu-list button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 2px solid transparent; background: none; box-shadow: none; padding: 7px 10px; border-radius: 10px; text-align: left; white-space: normal; transform: none; }
.menu-list button:hover { background: var(--butter); border-color: var(--line); transform: none; box-shadow: none; }
.menu-list .lbl { font: 15px var(--font-cute); }
.menu-list small { color: var(--muted); font: 12.5px var(--font-text); }
.menu-list hr { border: 0; border-top: 2px dashed var(--soft-line); margin: 4px 6px; }
#zoomLabel { min-width: 56px; }

/* ── 왼쪽 글 칸: 줄 공책 ── */
.panes { display: grid; grid-template-columns: var(--left-w, 390px) 10px 1fr; min-height: 0; }
.splitter { position: relative; cursor: col-resize; background: var(--panel); border-right: 2px solid var(--line); touch-action: none; }
.splitter::after { content: ''; position: absolute; left: 2px; top: 50%; width: 4px; height: 44px; margin-top: -22px; border-radius: 3px;
  background: repeating-linear-gradient(to bottom, var(--edge) 0 4px, transparent 4px 8px); }
.splitter:hover, .splitter.dragging, .splitter:focus-visible { background: var(--pink); outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
.text-pane { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.pane-title {
  font-size: 13px; line-height: 1.75; color: var(--ink); padding: 10px 14px; margin: 12px 14px 4px;
  background: var(--butter); border: 2px solid var(--line); border-radius: 12px; box-shadow: 3px 3px 0 var(--shade);
}
.pane-title b { font: 15px var(--font-cute); margin-right: 6px; font-weight: 400; }
.pane-title code, .pane-title kbd { font: 12.5px var(--font-text); color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); padding: 0 5px; border-radius: 6px; white-space: nowrap; }
#outline, #castText {
  flex: 1; width: 100%; min-height: 0; resize: none; border: 0; outline: none;
  padding: 12px 18px 20px 30px; color: var(--ink);
  font: 15.5px/30px var(--font-text); word-spacing: .2em; tab-size: 4; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto;
  background-color: var(--panel);
  background-image: linear-gradient(90deg, transparent 17px, var(--margin) 17px, var(--margin) 20px, transparent 20px),
    repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule) 29px 30px);
  background-position: 0 0, 0 12px; background-attachment: local;
}
#outline::selection, #castText::selection { background: var(--pink); }
#outline.big-text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; word-spacing: normal; }
.text-pane.nowrap #outline, .text-pane.nowrap #castText { white-space: pre; overflow-wrap: normal; }
.pane-tools { display: flex; justify-content: flex-end; padding: 2px 14px 0; }
button.mini { font-size: 12px; padding: 0 9px; border-width: 1.5px; box-shadow: 0 2px 0 var(--shade); background: var(--paper); color: var(--muted); }
button.mini[aria-pressed="true"] { color: var(--ink); background: var(--mint); }

/* ── 오른쪽 그림: 모눈종이 ── */
.view { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.view-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px;
  background: var(--panel); border-bottom: 2px solid var(--line); color: var(--muted);
}
.view-bar .spacer { flex: 1; }
#zoomGroup button { padding: 2px 10px; }
#mapPane {
  flex: 1; position: relative; overflow: auto; min-height: 0; outline: none; cursor: grab; touch-action: none;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px);
  background-size: 26px 26px;
}
#mapPane.panning { cursor: grabbing; }
#mapPane:focus-visible { box-shadow: inset 0 0 0 3px var(--pink); outline: none; }
#mapWrap { position: relative; display: inline-block; min-width: 100%; min-height: 100%; }
/* safe: 지도가 칸보다 크면 가운데 맞춤을 풀어 왼쪽 · 위가 잘리지 않게(인물 31명을 100%로 보면 왼쪽 739px에 갈 수 없었다, TROUBLESHOOTING 21) */
#mapWrap.center { display: flex; align-items: center; justify-content: center; align-items: safe center; justify-content: safe center; }
#map, #castMap { display: block; flex: none; overflow: visible; }
#map text, #castMap text { font-family: var(--font-cute); font-size: 14px; fill: var(--ink); user-select: none; pointer-events: none; }
#map .edge { fill: none; stroke: var(--edge); stroke-width: 2.4; stroke-linecap: round; }
#map .col-label { font-size: 13px; fill: var(--muted); letter-spacing: .06em; }
.empty-msg { font: 14px var(--font-cute); fill: var(--muted); }
#map .node { cursor: pointer; }
#map .node > .sh, #castMap .cnode > .sh { fill: var(--shade); }
#map .node > .bx { fill: var(--d1); stroke: var(--line); stroke-width: 2; }
#map .node.d2 > .bx { fill: var(--d2); }
#map .node.d3 > .bx { fill: var(--d3); }
#map .node.d4 > .bx { fill: var(--d4); }
#map .node.root > .bx { fill: var(--d0); }
#map .node.root text { fill: var(--d0-ink); font-size: 16px; }
#map .node:hover > .bx { stroke-width: 2.6; }
#map .node.sel > .bx { stroke: var(--sel); stroke-width: 3.2; }
#map .node.sel > .sh { fill: var(--sel); }
#map .node.dragging { opacity: .35; }
#map .node.drop-child > .bx { stroke: var(--sel); stroke-width: 3; stroke-dasharray: 6 4; }
#map #dropMark { fill: var(--sel); }
#map .ep { font-size: 12px; fill: var(--muted); }
#map .node.root .ep { fill: var(--d0-ink); }
#map .node.sel-in > .bx { stroke: var(--sel); stroke-width: 3; stroke-dasharray: 6 4; }
#map .fold { cursor: pointer; }
#map .fold circle, #map .fold rect { fill: var(--panel); stroke: var(--line); stroke-width: 2; }
#map .fold path { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
#map .fold.folded rect { fill: var(--pink); }
#map .fold text { font-size: 12px; }
#map .fold:hover circle, #map .fold:hover rect { fill: var(--butter); }
.fold-bar { padding-left: 10px; border-left: 2px dashed var(--soft-line); }
.fold-bar .lbl-sm { font: 13px var(--font-cute); color: var(--muted); margin-right: 2px; white-space: nowrap; }
.fold-bar button { padding: 2px 10px; font-size: 13px; }
#map .pill rect { stroke: var(--line); stroke-width: 1.5; }
#map .pill text { font-size: 12px; }
#map .pill.plant rect { fill: var(--peach); }
#map .pill.payoff rect { fill: var(--sky); }

/* 인물 지도 */
#castMap .cnode, #castMap .rel { cursor: pointer; }
#castMap .cnode .bx { stroke: var(--line); stroke-width: 2; }
#castMap .cnode .nm { font-size: 15px; }
#castMap .cnode .ds { font-family: var(--font-text); font-size: 12px; fill: var(--muted); }
#castMap .cnode.hi .bx { stroke: var(--sel); stroke-width: 3.2; }
#castMap .cnode.hi .sh { fill: var(--sel); }
#castMap .c0 .bx { fill: var(--c0); } #castMap .c0 .nm { fill: var(--c0-ink); } #castMap .c0 .ds { fill: var(--c0-sub); }
#castMap .c1 .bx { fill: var(--c1); } #castMap .c2 .bx { fill: var(--c2); } #castMap .c3 .bx { fill: var(--c3); } #castMap .c4 .bx { fill: var(--c4); }
#castMap .c5 .bx { fill: var(--c5); } #castMap .c6 .bx { fill: var(--c6); } #castMap .c7 .bx { fill: var(--c7); }
#castMap .rel path { fill: none; stroke: var(--edge); stroke-width: 2.6; stroke-linecap: round; }
#castMap .rel.c0 path { stroke: var(--c0-line); } #castMap .arrow.c0 { fill: var(--c0-line); }
#castMap .rel.c1 path { stroke: var(--c1-line); } #castMap .arrow.c1 { fill: var(--c1-line); }
#castMap .rel.c2 path { stroke: var(--c2-line); } #castMap .arrow.c2 { fill: var(--c2-line); }
#castMap .rel.c3 path { stroke: var(--c3-line); } #castMap .arrow.c3 { fill: var(--c3-line); }
#castMap .rel.c4 path { stroke: var(--c4-line); } #castMap .arrow.c4 { fill: var(--c4-line); }
#castMap .rel.c5 path { stroke: var(--c5-line); } #castMap .arrow.c5 { fill: var(--c5-line); }
#castMap .rel.c6 path { stroke: var(--c6-line); } #castMap .arrow.c6 { fill: var(--c6-line); }
#castMap .rel.c7 path { stroke: var(--c7-line); } #castMap .arrow.c7 { fill: var(--c7-line); }
#castMap .rel .lbl { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
#castMap .rel text { font-size: 12.5px; fill: var(--ink); }
#castMap .rel.hi path { stroke: var(--sel); stroke-width: 3.4; }
#castMap .rel.hi .lbl { fill: var(--pink); stroke: var(--line); }
#castMap .rel.off { opacity: .25; }
#castMap .rel.off path { stroke-dasharray: 5 6; }
#castMap .arrow-hi { fill: var(--sel); }
#nodeEditor {
  position: absolute; z-index: 2; margin: 0; font-family: var(--font-cute); font-size: 14px;
  color: var(--ink); background: var(--panel); border: 2px solid var(--sel); border-radius: 10px;
  padding: 0 10px; outline: none; box-shadow: 3px 3px 0 var(--shade);
}

/* ── 작품 메모: 줄 공책 한 장 ── */
.memo-pane { flex: 1; min-height: 0; overflow: auto; padding: 20px 22px; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px); background-size: 26px 26px; }

/* 카드: 스티커 + 마스킹 테이프 */
.card { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px 12px; box-shadow: 4px 4px 0 var(--shade); }

.card::before { content: ''; position: absolute; top: -10px; left: 50%; width: 58px; height: 18px; margin-left: -29px; background: var(--tape, var(--butter)); opacity: .9; transform: rotate(-4deg); border-radius: 3px; border: 1.5px dashed rgba(59, 47, 47, .25); }

.card .v { font: 30px/1.25 var(--font-cute); display: flex; align-items: center; gap: 8px; }

.card .v svg { width: 30px; height: 28px; flex: none; }
.card .s { font-size: 12.5px; color: var(--muted); }
.card.open .v { color: var(--plant); } .card.closed .v { color: var(--payoff); } .card.warn .v { color: var(--warn); }
.card.oldest .v { font-size: 19px; padding-top: 5px; color: var(--ink); }
.box { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; box-shadow: 5px 5px 0 var(--shade); overflow: hidden; }
.box > h2 { margin: 0; padding: 11px 16px; font: 17px var(--font-cute); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--line); background: var(--butter); }
.box.list > h2 { background: var(--sky); }
.box > h2 span { font: 12.5px var(--font-text); color: var(--ink); opacity: .75; }
/* 떡밥 흐름(회차 줄): 떡(심은 곳) → 물고기(거둔 곳) */
.tl { padding: 12px 18px 12px; }
.tl-row { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 12px; min-height: 38px; }

  border: 0; background: none; box-shadow: none; border-radius: 50%; cursor: pointer; transition: transform .12s;
}
.tl-dot svg { width: 30px; height: 28px; display: block; pointer-events: none; }

.tl-again:hover { transform: scale(1.4); box-shadow: none; }

.tl-empty { padding: 12px 0 6px; color: var(--muted); font: 14px var(--font-cute); }
.h2-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.tl-toggle { font-size: 12.5px; padding: 1px 10px; }
.tl-note { position: absolute; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; }
.tl-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 12.5px; color: var(--muted); padding: 4px 18px 14px; }
.tl-legend span { display: inline-flex; align-items: center; gap: 5px; }

table.ledger { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.ledger th, .ledger td { text-align: left; padding: 9px 14px; border-bottom: 2px dotted var(--soft-line); vertical-align: middle; }

.nag {
  position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%) rotate(-.5deg); z-index: 30; width: min(620px, calc(100vw - 24px));

.nag-btns button { font-size: 13.5px; }
.nag-btns [data-act="backup"] { background: var(--pink); }

}

  padding: 18px 22px 16px; transform: rotate(-.4deg);
}

<script id="core">
// ── 핵심 로직: 화면(DOM) 없이 동작한다. qa/core.test.mjs가 이 블록만 떼어 검사한다. ──
// 데이터 = 평평한 목록 [{depth, text}] (글의 줄 순서 = 나무의 앞순회 순서).
// 규칙: flat[0].depth === 0, flat[i].depth <= flat[i-1].depth + 1
const MM = (() => {
  // 글머리 기호(- * + • ○ ● ◦ · ▪ ■ □ ◆ ◇ ▶ ※ ☆ ★ …)는 뗀다 — 한글 · 워드 · 노션에서 붙여 넣을 때.
  // 번호(1. 1) ① 가.)는 작가가 일부러 쓴 것일 수 있어 이름으로 남긴다(그림 조작으로 글을 정리해도 지워지지 않게).
  const BULLET = /^[-*+•◦‣⁃○●◎◇◆□■▪▫▶▷►※☆★·∙・]\s+/;
  const INDENT = '  ';

  function indentWidth(ws) { let w = 0; for (const ch of ws) w += ch === '\t' ? 4 : 1; return w; }

  // 글 → 목록. 빈 줄은 건너뛴다. 들여쓰기 폭이 제각각이어도 "앞에서 더 얕은 줄"을 부모로 본다.
  function parse(text) {
    const lines = text.split('\n');
    const flat = [];
    const lineToIndex = new Array(lines.length);
    const stack = [];
    lines.forEach((raw, ln) => {
      const m = raw.match(/^([ \t]*)([\s\S]*)$/);   // '.'은 \r을 못 잡는다(TROUBLESHOOTING 3)
      const body = m[2].replace(/\s+$/, '').replace(BULLET, '').replace(/\s+$/, '');
      if (!body) { lineToIndex[ln] = flat.length ? flat.length - 1 : -2; return; }
      const w = indentWidth(m[1]);
      while (stack.length && stack[stack.length - 1] >= w) stack.pop();
      const depth = stack.length;
      stack.push(w);
      lineToIndex[ln] = flat.length;
      flat.push({ depth, text: body, line: ln });
    });
    return { flat, lineToIndex };
  }

  // 목록 → 글 (항상 공백 2칸 들여쓰기, 한 줄 = 한 칸)
  // gapDepth를 주면 그 깊이 이하 칸 앞에 빈 줄을 하나 넣는다 — 바로 윗줄이 더 깊을 때만, 즉 아래 칸이 있던 묶음이 끝날 때.
  // 소설에서는 gapDepth = '화' 깊이: 화 묶음 사이 · 부 사이가 한 줄씩 띄워져 읽기 쉽다(빈 줄은 parse가 건너뛴다).
  function serialize(flat, gapDepth = -1) {
    const out = [];
    flat.forEach((n, i) => {
      if (i > 0 && n.depth <= gapDepth && flat[i - 1].depth > n.depth) out.push('');
      out.push(INDENT.repeat(n.depth) + n.text);
    });
    return out.join('\n');
  }

  const clone = flat => flat.map(n => ({ depth: n.depth, text: n.text }));
  function valid(flat) {
    for (let i = 0; i < flat.length; i++) {
      const d = flat[i].depth;
      if (!Number.isInteger(d) || d < 0) return false;
      if (i === 0 ? d !== 0 : d > flat[i - 1].depth + 1) return false;
    }
    return true;
  }
  function subtreeEnd(flat, i) { const d = flat[i].depth; let j = i + 1; while (j < flat.length && flat[j].depth > d) j++; return j; }
  function prevSibling(flat, i) {
    const d = flat[i].depth;
    for (let k = i - 1; k >= 0; k--) { if (flat[k].depth === d) return k; if (flat[k].depth < d) return -1; }
    return -1;
  }
  function nextSibling(flat, i) { const e = subtreeEnd(flat, i); return e < flat.length && flat[e].depth === flat[i].depth ? e : -1; }
  function parentOf(flat, i) { const d = flat[i].depth; for (let k = i - 1; k >= 0; k--) if (flat[k].depth < d) return k; return -1; }
  const shiftBlock = (block, by) => block.map(n => ({ depth: n.depth + by, text: n.text }));

  // 아래 조작은 모두 새 목록과 선택할 위치 {flat, sel}을 돌려준다. 할 수 없는 조작이면 null. sel -1 = 작품 제목(뿌리).
  function addChild(flat, i, text) {
    const f = clone(flat);
    if (i < 0) { f.push({ depth: 0, text }); return { flat: f, sel: f.length - 1 }; }
    const at = subtreeEnd(f, i);
    f.splice(at, 0, { depth: f[i].depth + 1, text });
    return { flat: f, sel: at };
  }
  function addSibling(flat, i, text) {
    if (i < 0) return addChild(flat, -1, text);
    const f = clone(flat); const at = subtreeEnd(f, i);
    f.splice(at, 0, { depth: f[i].depth, text });
    return { flat: f, sel: at };
  }
  function remove(flat, i) {
    if (i < 0 || i >= flat.length) return null;
    const e = subtreeEnd(flat, i), ps = prevSibling(flat, i), ns = nextSibling(flat, i);
    const f = clone(flat); f.splice(i, e - i);
    const sel = ns >= 0 ? i : ps >= 0 ? ps : parentOf(flat, i);
    return { flat: f, sel };
  }
  function rename(flat, i, text) {
    if (i < 0 || i >= flat.length) return null;
    const f = clone(flat); f[i].text = text; return { flat: f, sel: i };
  }
  function moveUp(flat, i) {
    if (i < 0) return null;
    const ps = prevSibling(flat, i); if (ps < 0) return null;
    const e = subtreeEnd(flat, i), f = clone(flat);
    const out = [...f.slice(0, ps), ...f.slice(i, e), ...f.slice(ps, i), ...f.slice(e)];
    return { flat: out, sel: ps };
  }
  function moveDown(flat, i) {
    if (i < 0) return null;
    const ns = nextSibling(flat, i); if (ns < 0) return null;
    const e = subtreeEnd(flat, i), e2 = subtreeEnd(flat, ns), f = clone(flat);
    const out = [...f.slice(0, i), ...f.slice(e, e2), ...f.slice(i, e), ...f.slice(e2)];
    return { flat: out, sel: i + (e2 - e) };
  }
  // 앞 형제의 마지막 하위로 들어간다
  function indent(flat, i) {
    if (i < 0 || prevSibling(flat, i) < 0) return null;
    const e = subtreeEnd(flat, i), f = clone(flat);
    const out = [...f.slice(0, i), ...shiftBlock(f.slice(i, e), 1), ...f.slice(e)];
    return { flat: out, sel: i };
  }
  // 부모 바로 다음 형제가 된다(뒤따르던 형제들은 부모 밑에 남는다)
  function outdent(flat, i) {
    if (i < 0) return null;
    const p = parentOf(flat, i); if (p < 0) return null;
    const e = subtreeEnd(flat, i), pe = subtreeEnd(flat, p), f = clone(flat);
    const out = [...f.slice(0, i), ...f.slice(e, pe), ...shiftBlock(f.slice(i, e), -1), ...f.slice(pe)];
    return { flat: out, sel: i + (pe - e) };
  }
  // 끌어 놓기: target 앞(before) · 뒤(after) · 하위(child). target -1 = 작품 제목(뿌리)이면 child만.
  function moveTo(flat, i, target, pos) {
    if (i < 0 || i >= flat.length) return null;
    const e = subtreeEnd(flat, i);
    if (target >= i && target < e) return null;
    const block = flat.slice(i, e);
    const rest = clone([...flat.slice(0, i), ...flat.slice(e)]);
    let at, nd;
    if (target < 0) { if (pos !== 'child') return null; at = rest.length; nd = 0; }
    else {
      const t = target >= e ? target - (e - i) : target;
      if (pos === 'before') { at = t; nd = rest[t].depth; }
      else if (pos === 'after') { at = subtreeEnd(rest, t); nd = rest[t].depth; }
      else if (pos === 'child') { at = subtreeEnd(rest, t); nd = rest[t].depth + 1; }
      else return null;
    }
    rest.splice(at, 0, ...shiftBlock(block, nd - flat[i].depth));
    return { flat: rest, sel: at };
  }

  // 목록 → 나무 (작품 제목이 뿌리)
  // 접기 열쇠: 위 칸들의 글 + 자기 글. 칸 번호는 글을 고치면 바뀌어서, 접은 칸을 이 열쇠로 기억한다.
  function foldKeys(flat) {
    const keys = [], stack = [];
    flat.forEach(n => { stack.length = n.depth; stack.push(squash(n.text)); keys.push(stack.join('\u0001')); });
    return keys;
  }
  // 한 단계(depth)의 칸 가운데 아래 칸이 있는 것의 열쇠 — "부까지 · 화까지 보기"에 쓴다
  function foldKeysAt(flat, depth) {
    const keys = foldKeys(flat);
    return keys.filter((k, i) => flat[i].depth === depth && flat[i + 1] && flat[i + 1].depth > flat[i].depth);
  }
  // folded(열쇠 Set)에 든 칸은 아래 칸을 그리지 않고, 숨긴 칸 수(hidden)를 단다
  function buildTree(flat, rootText, folded) {
    const root = { text: rootText, idx: -1, depth: -1, children: [], kids: flat.length > 0, hidden: 0 };
    const stack = [root];
    const keys = folded && folded.size ? foldKeys(flat) : null;
    let skipTo = -1;
    flat.forEach((n, idx) => {
      if (idx < skipTo) return;
      const kids = !!(flat[idx + 1] && flat[idx + 1].depth > n.depth);
      const node = { text: n.text, idx, depth: n.depth, children: [], kids, hidden: 0 };
      while (stack.length > n.depth + 1) stack.pop();
      stack[stack.length - 1].children.push(node);
      stack.push(node);
      if (keys && kids && folded.has(keys[idx])) { skipTo = subtreeEnd(flat, idx); node.hidden = skipTo - idx - 1; }
    });
    return root;
  }

  // 왼쪽→오른쪽 나무 배치. 같은 단계(부 · 화 · 장면)는 같은 세로줄에 맞춘다.
  // measure(text, isRoot, idx): 칸 안 내용의 폭. idx로 회차 번호 · 떡밥 꼬리표까지 잴 수 있다.
  function layout(root, measure, o = {}) {
    const padX = o.padX ?? 12, H = o.nodeH ?? 32, RH = o.rootH ?? 40, hGap = o.hGap ?? 56, vGap = o.vGap ?? 10, minW = o.minW ?? 56;
    const colW = [];
    (function size(n, level) {
      n.level = level;
      n.w = Math.max(minW, Math.ceil(measure(n.text, level === 0, n.idx)) + padX * 2);
      n.h = level === 0 ? RH : H;
      colW[level] = Math.max(colW[level] || 0, n.w);
      n.children.forEach(c => size(c, level + 1));
    })(root, 0);
    const colX = []; let x = 0;
    colW.forEach((w, l) => { colX[l] = x; x += w + hGap; });
    let nextY = 0;
    (function place(n) {
      if (!n.children.length) { n.cy = nextY + n.h / 2; nextY += n.h + vGap; }
      else { n.children.forEach(place); n.cy = (n.children[0].cy + n.children[n.children.length - 1].cy) / 2; }
      n.x = colX[n.level]; n.y = n.cy - n.h / 2;
    })(root);
    const nodes = [], edges = [];
    let minY = Infinity, maxY = -Infinity;
    (function collect(n) {
      nodes.push(n); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y + n.h);
      n.children.forEach(c => { edges.push({ from: n, to: c }); collect(c); });
    })(root);
    nodes.forEach(n => { n.y -= minY; n.cy -= minY; });
    return {
      nodes: nodes.map(n => ({ idx: n.idx, text: n.text, level: n.level, x: n.x, y: n.y, w: n.w, h: n.h, cy: n.cy, kids: !!n.kids, hidden: n.hidden || 0 })),
      edges: edges.map(({ from, to }) => ({ x1: from.x + from.w, y1: from.cy, x2: to.x, y2: to.cy, to: to.idx })),
      width: colX[colX.length - 1] + colW[colW.length - 1], height: maxY - minY, colX, colW,
    };
  }

  function stats(flat) {
    const byDepth = [];
    flat.forEach(n => { byDepth[n.depth] = (byDepth[n.depth] || 0) + 1; });
    return { total: flat.length, byDepth };
  }

  // 표 칸: 탭 · 줄바꿈 · 따옴표가 있으면 따옴표로 감싼다(엑셀 · 구글 시트 붙여넣기 규칙)
  const cell = s => /[\t\n"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  const squash = s => s.replace(/\s+/g, ' ').trim();

  // ════ 소설용 ════
  // 구조: 깊이마다 이름이 있다. '화' 깊이(ep)의 칸마다 회차 번호를 위에서부터 차례로 매긴다.
  const STRUCTURES = {
    '부화장면': { label: '부 › 화 › 장면', levels: ['부', '화', '장면'], ep: 1 },
    '화장면': { label: '화 › 장면', levels: ['화', '장면'], ep: 0 },
  };
  const DEFAULT_STRUCTURE = '부화장면';
  const structureOf = id => STRUCTURES[id] || STRUCTURES[DEFAULT_STRUCTURE];
  const levelName = (id, depth) => structureOf(id).levels[depth] || '세부';
  const epDepth = id => structureOf(id).ep;   // '화'가 몇 번째 깊이인가(글 정리 때 빈 줄 기준)

  // 떡밥 꼬리표: 줄 안의 [떡밥 이름]은 심기, [회수 이름]은 거두기. 콜론은 있어도 된다: [떡밥: 이름]
  const TAG = /\[\s*(떡밥|회수)\s*:?\s*([^\]]*?)\s*\]/g;
  function splitTags(text) {
    const tags = [];
    const rest = text.replace(TAG, (all, kind, name) => {
      const nm = squash(name);
      if (!nm) return all;                       // [떡밥]처럼 이름이 없으면 글자 그대로 둔다
      tags.push({ kind: kind === '떡밥' ? 'plant' : 'payoff', name: nm });
      return ' ';
    });
    return { title: squash(rest), tags };
  }

  // 칸마다: 제목 · 꼬리표 · 회차 번호(epNo, '화' 칸만) · 속한 화(inEp, 화와 그 아래 칸)
  function decorate(flat, id) {
    const s = structureOf(id);
    let count = 0, cur = null;
    return flat.map(n => {
      const { title, tags } = splitTags(n.text);
      let epNo = null;
      if (n.depth === s.ep) { epNo = ++count; cur = epNo; }
      else if (n.depth < s.ep) cur = null;
      return { title, tags, epNo, inEp: n.depth >= s.ep ? cur : null };
    });
  }

  // 떡밥 장부: 이름별로 심은 곳 · 거둔 곳을 모은다.
  // 상태 open(아직 안 거둠) · closed(거둠) · orphan(거둔 곳만 있음) · early(심기보다 먼저 거둠)
  function ledger(flat, id) {
    const deco = decorate(flat, id);
    const lastEp = deco.reduce((m, d) => d.epNo || m, 0);
    const byName = new Map();
    deco.forEach((d, i) => d.tags.forEach(t => {
      if (!byName.has(t.name)) byName.set(t.name, { name: t.name, plants: [], payoffs: [] });
      byName.get(t.name)[t.kind === 'plant' ? 'plants' : 'payoffs'].push({ i, ep: d.inEp });
    }));
    const rank = { open: 0, orphan: 1, early: 2, closed: 3 };
    const items = [...byName.values()].map(x => {
      const plant = x.plants[0] || null;
      const payoff = plant ? (x.payoffs.find(o => o.i > plant.i) || x.payoffs[0] || null) : (x.payoffs[0] || null);
      const status = !plant ? 'orphan' : !payoff ? 'open' : payoff.i < plant.i ? 'early' : 'closed';
      const age = status === 'open' && plant.ep ? lastEp - plant.ep : null;               // 심은 뒤 몇 화 지났나
      const span = status === 'closed' && plant.ep && payoff.ep ? payoff.ep - plant.ep : null; // 몇 화 만에 거뒀나
      // 다시 꺼낸 곳: 첫 심기 말고 또 [떡밥]을 단 곳 · 짝으로 고른 회수 말고 또 [회수]를 단 곳(HANDOFF §3 A′ 5 · A″ 5 · A‴ 3)
      const again = [...x.plants.slice(1).map(p => ({ kind: 'plant', i: p.i, ep: p.ep })), ...x.payoffs.filter(o => o !== payoff).map(o => ({ kind: 'payoff', i: o.i, ep: o.ep }))].sort((a, b) => a.i - b.i);
      const lastPlant = x.plants[x.plants.length - 1];
      const quiet = status === 'open' && x.plants.length > 1 && lastPlant.ep ? lastEp - lastPlant.ep : null;   // 마지막으로 꺼낸 뒤 몇 화
      return { name: x.name, status, plant, payoff, plants: x.plants, payoffs: x.payoffs, age, span, again, quiet };
    });
    items.sort((a, b) => rank[a.status] - rank[b.status] || (b.age ?? -1) - (a.age ?? -1) || (a.plant || a.payoff).i - (b.plant || b.payoff).i);
    return {
      items, lastEp,
      open: items.filter(x => x.status === 'open').length,
      warn: items.filter(x => x.status === 'orphan' || x.status === 'early').length,
    };
  }

  // 인물 글: 한 줄에 한 명 "이름 : 설명", 관계는 "민준 -> 서아 : 짝사랑 (12화~)".
  // 화살표: -> · → (한쪽), <-> · ↔ (서로). 콜론이 화살표보다 앞이면 인물 줄(설명 안의 화살표는 그대로).
  // 기간: (12화~) 12화부터 · (~11화) 11화까지 · (3~11화) · (12화) = 12화부터
  const ARROW = /\s*(<->|↔|->|→)\s*/;
  const RANGE = /\(\s*(?:(\d+)\s*화?)?\s*(~|-|–)?\s*(?:(\d+)\s*화?)?\s*\)\s*$/;
  // 인물 줄의 이름 뒤 괄호는 다른 이름(호칭 · 별명): "곽두식(곽반장, 반장님) : 철근 반장".
  // 관계 줄에 다른 이름을 써도 같은 사람이고, 점검 탭의 인물 등장에서도 센다
  const ALIAS = /^(.+?)\s*\(([^()]*)\)$/;
  function splitName(raw) {
    const m = raw.match(ALIAS);
    return m && squash(m[1]) ? { name: squash(m[1]), aliases: m[2].split(/[,，、·]/).map(squash).filter(Boolean) } : { name: raw, aliases: [] };
  }
  function parseCast(text) {
    const chars = [], rels = [], byName = new Map(), aliasOf = new Map();
    const ensure = (name, line) => {
      name = aliasOf.get(name) || name;
      if (!byName.has(name)) { byName.set(name, chars.length); chars.push({ name, desc: '', line, declared: false, aliases: [] }); }
      return byName.get(name);
    };
    const lines = text.split('\n').map(raw => {
      const s = squash(raw.replace(/^[ \t]+/, '').replace(BULLET, ''));
      const colon = s.indexOf(':'), am = s.match(ARROW);
      return { s, colon, am, rel: !!(am && (colon < 0 || am.index < colon)) };
    });
    lines.forEach(({ s, colon, rel }) => {                // 먼저 다른 이름을 모은다(관계 줄이 인물 줄보다 위에 있어도 되게)
      if (!s || rel) return;
      const { name, aliases } = splitName(squash(colon < 0 ? s : s.slice(0, colon)));
      aliases.forEach(a => { if (a !== name && !aliasOf.has(a)) aliasOf.set(a, name); });
    });
    lines.forEach(({ s, colon, am, rel }, ln) => {
      if (!s) return;
      if (rel) {
        const from = squash(s.slice(0, am.index));
        const after = s.slice(am.index + am[0].length), c2 = after.indexOf(':');
        const to = squash(c2 < 0 ? after : after.slice(0, c2));
        let label = c2 < 0 ? '' : squash(after.slice(c2 + 1));
        if (!from || !to) return;
        let start = null, end = null;
        const rm = label.match(RANGE);
        if (rm && (rm[1] || rm[3])) {
          start = rm[1] ? +rm[1] : null;                    // (12화)처럼 물결이 없으면 그 화부터
          end = rm[2] && rm[3] ? +rm[3] : null;
          label = squash(label.slice(0, rm.index));
        }
        rels.push({ from: ensure(from, ln), to: ensure(to, ln), label, start, end, mutual: am[1] === '<->' || am[1] === '↔', line: ln });
      } else {
        const { name, aliases } = splitName(squash(colon < 0 ? s : s.slice(0, colon)));
        const desc = colon < 0 ? '' : squash(s.slice(colon + 1));
        if (!name) return;
        const c = chars[ensure(name, ln)];
        if (!c.declared) { c.declared = true; c.line = ln; c.desc = desc; c.aliases = aliases; }
      }
    });
    return { chars, rels };
  }
  const activeAt = (r, at) => at == null || ((r.start == null || r.start <= at) && (r.end == null || at <= r.end));
  // 회차 시점에 살아 있는 관계만 남긴 인물 목록(지도 배치용). keep[k] = 원래 관계 번호, ck[j] = 원래 인물 번호. at이 없으면 전부.
  // o.hideChars면 그 시점에 관계가 하나도 없는 인물도 뺀다(31명이면 지도가 30%로 줄여도 넘쳤다, TROUBLESHOOTING 21).
  // 관계를 아예 안 적은 인물은 시점과 상관이 없으니 남긴다
  function castAt(cast, at, o = {}) {
    const keep = [];
    cast.rels.forEach((r, i) => { if (activeAt(r, at)) keep.push(i); });
    if (!o.hideChars || at == null) return { chars: cast.chars, rels: keep.map(i => cast.rels[i]), keep, ck: cast.chars.map((_, k) => k) };
    const any = new Set(), now = new Set();
    cast.rels.forEach(r => { any.add(r.from); any.add(r.to); });
    keep.forEach(i => { now.add(cast.rels[i].from); now.add(cast.rels[i].to); });
    const ck = cast.chars.map((_, k) => k).filter(k => now.has(k) || !any.has(k));
    const to = new Map(ck.map((k, j) => [k, j]));
    return { chars: ck.map(k => cast.chars[k]), rels: keep.map(i => ({ ...cast.rels[i], from: to.get(cast.rels[i].from), to: to.get(cast.rels[i].to) })), keep, ck };
  }
  function rangeText(r) {
    return r.start != null && r.end != null ? `${r.start}~${r.end}화` : r.start != null ? `${r.start}화~` : r.end != null ? `~${r.end}화` : '';
  }
  function relText(r) { const rg = rangeText(r); return r.label && rg ? `${r.label} (${rg})` : r.label || (rg ? `(${rg})` : ''); }

  // 인물 지도 배치: 인물을 원 위에 고르게 놓는다(자유 배치 아님). 같은 두 사람 사이 관계가 여럿이면 곡선을 벌린다.
  // measure(text, 'name' | 'label')
  // 칸 안 설명은 짧게: 18자를 넘으면 자르고 '…'
  function shortDesc(s, max = 18) { const a = [...String(s || '').trim()]; return a.length > max ? a.slice(0, max - 1).join('') + '…' : a.join(''); }
  // measure(text, 'name' | 'desc' | 'label')
  function castLayout(cast, measure, o = {}) {
    const padX = o.padX ?? 16, H = o.nodeH ?? 36, H2 = o.nodeH2 ?? 52, gap = o.gap ?? 28, minR = o.minR ?? 170, spread = o.spread ?? 44, LH = 22;
    const n = cast.chars.length;
    const nodes = cast.chars.map((c, k) => {
      const desc = shortDesc(c.desc);
      const w = Math.max(64, Math.ceil(Math.max(measure(c.name, 'name'), desc ? measure(desc, 'desc') : 0)) + padX * 2);
      return { k, name: c.name, desc, line: c.line, w, h: desc ? H2 : H };
    });
    const maxW = nodes.reduce((m, v) => Math.max(m, v.w), 0);
    const R = n > 1 ? Math.max(minR, (maxW + gap) / (2 * Math.sin(Math.PI / n))) : 0;
    nodes.forEach((v, k) => { const a = -Math.PI / 2 + 2 * Math.PI * k / Math.max(n, 1); v.cx = R * Math.cos(a); v.cy = R * Math.sin(a); });
    const groups = new Map();
    cast.rels.forEach((r, ri) => {
      if (r.from === r.to) return;                 // 자기 자신과의 관계는 그리지 않는다
      const key = Math.min(r.from, r.to) + ':' + Math.max(r.from, r.to);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(ri);
    });
    const clip = (v, tx, ty) => {                  // 칸 가장자리에서 선이 시작 · 끝나게
      const dx = tx - v.cx, dy = ty - v.cy, hw = v.w / 2 + 2, hh = v.h / 2 + 2;
      const t = Math.min(1, dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
      return [v.cx + dx * t, v.cy + dy * t];
    };
    const edges = [];
    groups.forEach(list => list.forEach((ri, j) => {
      const r = cast.rels[ri];
      const A = nodes[Math.min(r.from, r.to)], B = nodes[Math.max(r.from, r.to)];
      const dx = B.cx - A.cx, dy = B.cy - A.cy, len = Math.hypot(dx, dy) || 1;
      const off = (j - (list.length - 1) / 2) * spread;
      const mx = (A.cx + B.cx) / 2, my = (A.cy + B.cy) / 2;
      const qx = mx - dy / len * off * 2, qy = my + dx / len * off * 2;   // 곡선 꼭짓점이 가운데서 off만큼 비켜나게
      const [x1, y1] = clip(nodes[r.from], qx, qy), [x2, y2] = clip(nodes[r.to], qx, qy);
      const text = relText(r);
      edges.push({ ri, line: r.line, from: r.from, to: r.to, mutual: r.mutual, x1, y1, qx, qy, x2, y2, text, tw: text ? Math.ceil(measure(text, 'label')) + 14 : 0, th: LH });
    }));
    // 관계 이름표: 곡선 가운데부터 조금씩 옮겨 가며 칸 · 다른 이름표와 겹치지 않는 자리를 찾는다
    const bez = (e, t) => { const u = 1 - t; return [u * u * e.x1 + 2 * u * t * e.qx + t * t * e.x2, u * u * e.y1 + 2 * u * t * e.qy + t * t * e.y2]; };
    const placed = nodes.map(v => [v.cx - v.w / 2 - 2, v.cy - v.h / 2 - 2, v.cx + v.w / 2 + 2, v.cy + v.h / 2 + 2]);
    const hits = b => placed.some(p => b[0] < p[2] && b[2] > p[0] && b[1] < p[3] && b[3] > p[1]);
    edges.forEach(e => {
      if (!e.tw) { [e.lx, e.ly] = bez(e, 0.5); return; }
      let pick = null;
      for (const t of [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74]) {
        const [x, y] = bez(e, t), b = [x - e.tw / 2, y - LH / 2, x + e.tw / 2, y + LH / 2];
        if (!hits(b)) { pick = [x, y, b]; break; }
      }
      if (!pick) { const [x, y] = bez(e, 0.5); pick = [x, y, [x - e.tw / 2, y - LH / 2, x + e.tw / 2, y + LH / 2]]; }
      [e.lx, e.ly] = pick; placed.push(pick[2]);
    });
    // 전체 크기: 칸 · 이름표 · 곡선을 모두 담고 왼쪽 위를 (0, 0)으로
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const grow = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
    placed.forEach(b => grow(...b));
    edges.forEach(e => [0.25, 0.5, 0.75].forEach(t => { const [x, y] = bez(e, t); grow(x, y, x, y); }));
    if (!n) { x0 = y0 = x1 = y1 = 0; }
    nodes.forEach(v => { v.cx -= x0; v.cy -= y0; v.x = v.cx - v.w / 2; v.y = v.cy - v.h / 2; });
    edges.forEach(e => { e.x1 -= x0; e.x2 -= x0; e.qx -= x0; e.lx -= x0; e.y1 -= y0; e.y2 -= y0; e.qy -= y0; e.ly -= y0; });
    return { nodes, edges, width: x1 - x0, height: y1 - y0 };
  }

  // 회차별 시놉시스 표(탭 구분): 회차 · (부) · 제목 · 장면 · 떡밥 심기 · 떡밥 회수
  function synopsisTSV(flat, id) {
    const s = structureOf(id), deco = decorate(flat, id);
    const head = ['회차'];
    if (s.ep > 0) head.push(s.levels.slice(0, s.ep).join(' › '));
    head.push('제목', s.levels[s.ep + 1] || '세부', '떡밥 심기', '떡밥 회수');
    const rows = [head];
    deco.forEach((d, i) => {
      if (!d.epNo) return;
      const up = [];
      for (let p = parentOf(flat, i); p >= 0; p = parentOf(flat, p)) up.unshift(deco[p].title);
      const end = subtreeEnd(flat, i), kids = [], plants = [], payoffs = [];
      for (let k = i; k < end; k++) {
        if (flat[k].depth === flat[i].depth + 1 && deco[k].title) kids.push(deco[k].title);
        deco[k].tags.forEach(t => (t.kind === 'plant' ? plants : payoffs).push(t.name));
      }
      const row = [d.epNo + '화'];
      if (s.ep > 0) row.push(up.join(' › '));
      row.push(d.title, kids.join(' / '), plants.join(', '), payoffs.join(', '));
      rows.push(row);
    });
    return rows.map(r => r.map(cell).join('\t')).join('\n');
  }

  // 백업 파일: 사람이 읽을 수 있는 글 파일 하나. 다른 프로그램(메모장 · 한글)으로 열어도 내용이 보인다.
  const FILE_HEAD = '소설 기획 지도 v1';
  function toFile(doc) {
    return [
      FILE_HEAD,
      `제목: ${doc.site || ''}`,
      `구조: ${structureOf(doc.structure).label}`,
      `회당 목표 글자 수: ${doc.target || ''}`,
      '', '== 플롯 ==', doc.text || '', '', '== 인물 ==', doc.cast || '', '',
      // 작품 메모는 맨 끝(있을 때만). 메모 안에 '== 플롯 ==' 같은 줄이 있어도 그대로 메모다
      ...(doc.memo && doc.memo.trim() ? ['== 메모 ==', doc.memo.replace(/\s+$/, ''), ''] : []),
    ].join('\n');
  }
  // 이 형식이 아니면 파일 전체를 플롯 글로 본다(아무 들여쓰기 글이나 불러올 수 있게)
  function fromFile(raw) {
    const text = raw.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    const lines = text.split('\n');
    const trimEnd = a => { a = a.slice(); while (a.length && !a[a.length - 1].trim()) a.pop(); return a.join('\n'); };
    const first = lines.find(l => l.trim()) || '';
    if (first.trim() !== FILE_HEAD && !lines.some(l => l.trim() === '== 플롯 ==')) return { plain: true, text: trimEnd(lines) };
    const doc = { plain: false, site: '', text: '', cast: '', memo: '' };
    const buf = { plot: [], cast: [], memo: [] };
    let sec = null;
    for (const l of lines) {
      const t = l.trim();
      if (sec === 'memo') { buf.memo.push(l); continue; }          // 메모 뒤는 모두 메모
      if (t === '== 메모 ==') { sec = 'memo'; continue; }
      if (t === '== 플롯 ==') { sec = 'plot'; continue; }
      if (t === '== 인물 ==') { sec = 'cast'; continue; }
      if (sec) { buf[sec].push(l); continue; }
      const m = l.match(/^\s*([^:]+?)\s*:\s*(.*?)\s*$/);
      if (!m) continue;
      if (m[1] === '제목') doc.site = m[2];
      else if (m[1] === '구조') { const id = Object.keys(STRUCTURES).find(k => STRUCTURES[k].label.replace(/\s/g, '') === m[2].replace(/\s/g, '')); if (id) doc.structure = id; }
      else if (m[1] === '회당 목표 글자 수') { const v = parseInt(m[2].replace(/[^\d]/g, ''), 10); doc.target = v > 0 ? v : null; }
    }
    doc.text = trimEnd(buf.plot); doc.cast = trimEnd(buf.cast); doc.memo = trimEnd(buf.memo);
    return doc;
  }

  // 떡밥 흐름(회차 줄): 떡밥마다 심은 화(from) ~ 거둔 화(to). 아직이면 to = 마지막 화. 눈금은 10개 안팎
  function ledgerTimeline(lg) {
    const last = lg.lastEp || 0;
    const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(v => last / v <= 10) || Math.ceil(last / 10);
    const ticks = [];
    if (last) {
      ticks.push(1);
      for (let e = step; e <= last; e += step) if (e > 1) ticks.push(e);
      const end = ticks[ticks.length - 1];
      if (end !== last && last - end >= step / 2) ticks.push(last);
    }
    const rows = lg.items.map(x => {
      const from = x.plant ? x.plant.ep : null;
      const to = x.status === 'open' ? (from != null ? last : null) : x.payoff ? x.payoff.ep : null;
      return { name: x.name, status: x.status, from, to, plantI: x.plant ? x.plant.i : null, payoffI: x.payoff ? x.payoff.i : null, again: (x.again || []).filter(a => a.ep != null) };
    });
    return { last, ticks, rows };
  }

  // ════ 점검: 찾아 바꾸기 · 비슷한 이름 · 같은 회차 제목 · 인물 등장 ════
  // 글자 그대로 찾아 바꾼다(정규식 아님). count = 바꾼 곳 수
  function replaceAll(text, find, to) {
    if (!find) return { text, count: 0 };
    const parts = String(text).split(find);
    return { text: parts.join(to), count: parts.length - 1 };
  }

  // 표가 아니면 null. 머리줄(회차 · 제목 · 장면 · 떡밥 …)을 알아보면 부 › 화 › 장면으로, 모르면 칸 순서를 단계로 본다

    const raw = String(text).replace(/\r\n?/g, '\n').replace(/\n+$/, '');

    const flat = [];
    if (header) {
      const col = role => roles.indexOf(role), get = (r, role) => col(role) >= 0 ? (r[col(role)] || '') : '';

})();

  function renderCast() {
    // 시점 밖 관계 숨기기(기본): 그 회차에 살아 있는 관계만으로 선을 배치한다. 흐리게 보기면 전부 배치
    // 숨길 때는 그 시점에 관계가 없는 인물도 뺀다
    const view = MM.castAt(state.cast, state.hideOff ? state.at : null, { hideChars: true });
    CL = MM.castLayout(view, (t, kind) => kind === 'name' ? mName15(t) : kind === 'desc' ? mDesc(t) : mSmall(t) + 2);
    CL.nodes.forEach(v => { v.k = view.ck[v.k]; });                // 원래 인물 · 관계 번호로(색 · 선택 · 강조가 이 번호를 쓴다)
    CL.edges.forEach(e => { e.ri = view.keep[e.ri]; e.from = view.ck[e.from]; e.to = view.ck[e.to]; });
    if (!state.cast.chars.length) {
      sizeSvg(castSvg, 520, 80, castZoom);
      castSvg.innerHTML = '';
      updateWelcome();
      return;
    }
    sizeSvg(castSvg, CL.width + PAD * 2, CL.height + PAD * 2, castZoom);
    const o = PAD;
    const marker = (id, cls) => `<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="${cls}" d="M1 1L9 5L1 9z" stroke-linejoin="round"/></marker>`;
    let out = '<defs>' + CAST_COLORS.map(c => marker('arr-' + c, 'arrow ' + c)).join('') + marker('arrHi', 'arrow-hi') + '</defs>';
    CL.edges.forEach(e => {
      const on = MM.activeAt(state.cast.rels[e.ri], state.at), c = castColor(e.from), m = `url(#arr-${c})`;
      out += `<g class="rel ${c}${on ? '' : ' off'}" data-line="${e.line}" data-ri="${e.ri}" data-c="${c}">` +
        `<path d="M${o + e.x1} ${o + e.y1} Q${o + e.qx} ${o + e.qy} ${o + e.x2} ${o + e.y2}" marker-end="${m}"${e.mutual ? ` marker-start="${m}"` : ''}/>`;
      if (e.text) out += `<rect class="lbl" x="${o + e.lx - e.tw / 2}" y="${o + e.ly - e.th / 2}" width="${e.tw}" height="${e.th}" rx="${e.th / 2}"/>` +
        `<text x="${o + e.lx}" y="${o + e.ly}" text-anchor="middle" dominant-baseline="central">${esc(e.text)}</text>`;
      out += '</g>';
    });
    CL.nodes.forEach(v => {
      const c = state.cast.chars[v.k];
      const rx = Math.min(18, v.h / 2);
      out += `<g class="cnode ${castColor(v.k)}" data-line="${c.line}" data-k="${v.k}"><rect class="sh" x="${o + v.x + 3}" y="${o + v.y + 3}" width="${v.w}" height="${v.h}" rx="${rx}"/><rect class="bx" x="${o + v.x}" y="${o + v.y}" width="${v.w}" height="${v.h}" rx="${rx}"/>`;
      if (v.desc) out += `<text class="nm" x="${o + v.cx}" y="${o + v.cy - 9}" text-anchor="middle" dominant-baseline="central">${esc(v.name)}</text>` +
        `<text class="ds" x="${o + v.cx}" y="${o + v.cy + 11}" text-anchor="middle" dominant-baseline="central">${esc(v.desc)}</text>`;
      else out += `<text class="nm" x="${o + v.cx}" y="${o + v.cy}" text-anchor="middle" dominant-baseline="central">${esc(v.name)}</text>`;
      out += `<title>${esc(c.desc ? c.name + ' — ' + c.desc : c.name)}</title></g>`;
    });
    castSvg.innerHTML = out;
    markCast();
    updateWelcome();
    updateZoomLabel();
  }
  // 글에서 고른 줄(또는 지도에서 누른 것)을 지도에 표시: 관계 줄이면 그 선과 두 사람, 인물 줄이면 그 사람과 닿은 선
  function markCast() {
    const line = state.castHi, { chars, rels } = state.cast;
    const hiRel = new Set(), hiChar = new Set();
    if (line != null) {
      rels.forEach((r, ri) => { if (r.line === line) { hiRel.add(ri); hiChar.add(r.from); hiChar.add(r.to); } });
      if (!hiRel.size) {
        const k = chars.findIndex(c => c.declared && c.line === line);
        if (k >= 0) { hiChar.add(k); rels.forEach((r, ri) => { if (r.from === k || r.to === k) hiRel.add(ri); }); }
      }
    }
    castSvg.querySelectorAll('.cnode').forEach(g => g.classList.toggle('hi', hiChar.has(+g.dataset.k)));
    castSvg.querySelectorAll('.rel').forEach(g => {
      const on = hiRel.has(+g.dataset.ri), p = g.querySelector('path'), m = on ? 'url(#arrHi)' : `url(#arr-${g.dataset.c})`;
      g.classList.toggle('hi', on); p.setAttribute('marker-end', m); if (p.hasAttribute('marker-start')) p.setAttribute('marker-start', m);
    });
  }

  // ── 아이콘: 떡(떡밥을 심은 곳) · 물고기(거둔 곳) · 물음표(확인할 것) ──
  const ICON = {
    mochi: '<svg class="mochi" viewBox="0 0 36 32" aria-hidden="true">' + $('.logo').innerHTML + '</svg>',
    fish: '<svg class="fish" viewBox="0 0 36 32" aria-hidden="true"><path class="fin" d="M25 16l7-6.5v13z"/><path class="body" d="M3.5 16c3.6-6.6 12.8-8.6 20.5-3.4 1.4.9 1.4 5.9 0 6.8C16.3 24.6 7.1 22.6 3.5 16z"/><circle class="eye" cx="10.5" cy="14.6" r="1.8"/></svg>',
    q: '<svg class="qmark" viewBox="0 0 36 32" aria-hidden="true"><circle class="body" cx="18" cy="16" r="12"/><text x="18" y="17" text-anchor="middle" dominant-baseline="central">?</text></svg>',
  };

  // ── 그리기: 떡밥 장부 ──
  function placeName(i) { const d = state.deco[i]; return (d.inEp ? d.inEp + '화 · ' : '') + (d.title || '(제목 없음)'); }
  function renderLedger() {
    const lg = MM.ledger(state.flat, state.structure);
    const badge = $('#openCount'); badge.textContent = lg.open; badge.hidden = !lg.open;
    // 장부가 안 보이면 숫자만 고치고 그리지 않는다(탭을 열 때 그린다). 보이지 않는 흐름의 폭을 재느라
    // 글자 하나 칠 때마다 화면 전체를 다시 배치해 600화에서 0.15초씩 걸렸다(TROUBLESHOOTING 20)
    if (state.mode !== 'ledger') return;
    if (!lg.items.length) {
      ledgerPane.innerHTML = `<div class="ledger-empty">${ICON.mochi}<div><p><b>아직 떡밥이 없어요</b></p><p>플롯 줄 끝에 <code>[떡밥 낡은 반지]</code>처럼 붙이면 심은 곳으로, <code>[회수 낡은 반지]</code>를 붙이면 거둔 곳으로 여기에 모여요.</p></div></div>`;
      return;
    }
    const go = (o, others = []) => o ? `<button class="go" data-i="${o.i}">${esc(placeName(o.i))}</button>${others.length ? ` <span class="muted" title="${esc(others.map(p => placeName(p.i)).join('\n'))}">외 ${others.length}곳</span>` : ''}` : '<span class="muted">—</span>';
    const STATE = { open: ['open', '아직'], closed: ['closed', '거둠'], orphan: ['warn', '확인'], early: ['warn', '확인'] };
    const memo = x => x.status === 'open' ? (x.age == null ? '' : (x.age === 0 ? '마지막 화에서 심음' : `심은 뒤 ${x.age}화 지남`) + (x.quiet != null && x.quiet !== x.age ? ` · 마지막으로 꺼낸 뒤 ${x.quiet}화` : ''))
      : x.status === 'closed' ? (x.span == null ? '' : x.span === 0 ? '같은 화에서 거둠' : `${x.span}화 만에 거둠`)
      : x.status === 'orphan' ? '심은 곳이 없음 — 이름이 같은지 확인' : '심기보다 먼저 거둠';
    const rows = lg.items.map(x => `<tr><td><span class="state ${STATE[x.status][0]}">${STATE[x.status][1]}</span></td>` +
      `<td class="name">${esc(x.name)}</td><td>${go(x.plant, x.plants.slice(1))}</td><td>${go(x.payoff, x.payoffs.filter(o => o !== x.payoff))}</td><td class="muted">${memo(x)}</td></tr>`).join('');
    // 요약 카드
    const closed = lg.items.filter(x => x.status === 'closed').length;
    const oldest = lg.items.find(x => x.status === 'open' && x.age != null);
    const card = (cls, k, v, sub = '') => `<div class="card ${cls}"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
    const cards = card('open', '아직 안 거둔 떡밥', `${ICON.mochi}${lg.open}<small>개</small>`) +
      card('closed', '거둔 떡밥', `${ICON.fish}${closed}<small>개</small>`) +
      (lg.warn ? card('warn', '확인할 것', `${ICON.q}${lg.warn}<small>개</small>`, '이름이 같은지 · 순서가 맞는지') : '') +
      card('oldest', '가장 오래 묵은 떡밥', oldest ? esc(oldest.name) : '—', oldest ? (oldest.age ? `심은 뒤 ${oldest.age}화 지남` : '마지막 화에서 심음') + (oldest.quiet != null && oldest.quiet !== oldest.age ? ` · 마지막으로 꺼낸 뒤 ${oldest.quiet}화` : '') : '아직 안 거둔 떡밥이 없습니다');
    // 떡밥 흐름: 화 순서를 따라 심은 곳 → 거둔 곳
    const tl = MM.ledgerTimeline(lg), pos = ep => ((ep - 0.5) / tl.last * 100).toFixed(3) + '%';
    const DOT_ICON = { plant: ICON.mochi, payoff: ICON.fish, warn: ICON.q };
    const dot = (cls, i, ep) => i == null || ep == null ? '' : `<button class="go tl-dot ${cls}" data-i="${i}" style="left:${pos(ep)}" title="${esc(placeName(i))}" aria-label="${esc(placeName(i))}">${DOT_ICON[cls]}</button>`;
    // 다시 꺼낸 곳: 막대 위 작은 점(큰 그림 아래에 깔리게 먼저 그린다)
    const again = r => r.again.map(a => `<button class="go tl-again ${a.kind}" data-i="${a.i}" style="left:${pos(a.ep)}" title="${esc('다시 꺼낸 곳: ' + placeName(a.i))}" aria-label="${esc('다시 꺼낸 곳: ' + placeName(a.i))}"></button>`).join('');
    const tlRow = r => {
      let body = again(r);
      if (r.status === 'closed' && r.from != null && r.to != null) body = body + `<span class="tl-bar closed" style="left:${pos(r.from)};width:calc(${pos(r.to)} - ${pos(r.from)})"></span>` + dot('plant', r.plantI, r.from) + dot('payoff', r.payoffI, r.to);
      else if (r.status === 'open' && r.from != null) body = body + `<span class="tl-bar open" style="left:${pos(r.from)};width:calc(100% - ${pos(r.from)})"></span>` + dot('plant', r.plantI, r.from);
      else if (r.status === 'early' && r.from != null && r.to != null) body = body + `<span class="tl-bar warn" style="left:${pos(r.to)};width:calc(${pos(r.from)} - ${pos(r.to)})"></span>` + dot('warn', r.payoffI, r.to) + dot('plant', r.plantI, r.from);
      else if (r.status === 'orphan' && r.to != null) body = body + dot('warn', r.payoffI, r.to) + `<span class="tl-note" style="left:calc(${pos(r.to)} + 12px)">심은 곳 없음</span>`;
      else body += `<span class="tl-note" style="left:0">회차를 알 수 없음 (화보다 위 단계에 붙음)</span>`;
      const span = r.from != null && r.to != null ? Math.abs(r.to - r.from) : null;   // 두 그림 사이 거리(화) — 좁으면 작은 점으로
      return `<div class="tl-row"${span != null && r.status !== 'open' ? ` data-span="${span}"` : ''}><span class="tl-name" title="${esc(r.name)}">${esc(r.name)}</span><div class="tl-track">${body}</div></div>`;
    };
    // 떡밥이 20개를 넘는 긴 작품에서만 거둔 것을 처음에 접어 둔다(아직 안 거둔 것 · 확인할 것이 먼저).
    // 전에는 '거둔 것 7개 이상'이 기준이라 24화짜리 작품에서도 흐름이 거의 비어 보였다(HANDOFF §3 A″ 2)
    const showClosed = state.showClosed ?? tl.rows.length <= 20;
    const rowsShown = tl.rows.filter(r => showClosed || r.status !== 'closed');
    const toggle = closed ? `<button class="tl-toggle" data-act="closed">${showClosed ? `거둔 떡밥 ${closed}개 숨기기` : `거둔 떡밥 ${closed}개도 보기`}</button>` : '';
    const timeline = tl.last ? `<section class="box"><h2>떡밥 흐름 <span class="h2-right"><span>1화 ~ ${tl.last}화 · 그림을 누르면 플롯의 그 줄로</span>${toggle}</span></h2><div class="tl" data-last="${tl.last}">` +
      `<div class="tl-row tl-axis"><span></span><div class="tl-track">${tl.ticks.map(t => `<span class="tl-tick" style="left:${pos(t)}">${t}화</span>`).join('')}</div></div>` +
      (rowsShown.length ? rowsShown.map(tlRow).join('') : '<div class="tl-empty">아직 안 거둔 떡밥이 없어요 — 다 거뒀어요!</div>') + `</div><div class="tl-legend"><span>${ICON.mochi}떡밥 심은 곳</span><span>${ICON.fish}거둔 곳</span>` +
      `${lg.warn ? `<span>${ICON.q}확인할 것</span>` : ''}<span>점선 = 아직 안 거둠</span>${rowsShown.some(r => r.again.length) ? '<span><i class="tl-again-key"></i>작은 점 = 다시 꺼낸 곳</span>' : ''}</div></section>` : '';
    ledgerPane.innerHTML = `<div class="ledger-wrap"><div class="cards">${cards}</div>${timeline}` +
      `<section class="box list"><h2>전체 목록 <span>떡밥 ${lg.items.length}개${lg.lastEp ? ` · 지금 계획은 ${lg.lastEp}화까지` : ''}</span></h2>` +
      `<table class="ledger"><thead><tr><th>상태</th><th>떡밥</th><th>심은 곳</th><th>거둔 곳</th><th>메모</th></tr></thead><tbody>${rows}</tbody></table></section></div>`;
    tightenTimeline();
  }
  // 심은 곳과 거둔 곳 그림이 겹칠 만큼 가까우면(36px 미만) 작은 점으로 바꾼다
  function tightenTimeline() {
    const tl = ledgerPane.querySelector('.tl'), tr = tl && tl.querySelector('.tl-row:not(.tl-axis) .tl-track');
    if (!tr || !tr.clientWidth) return;
    const w = tr.clientWidth, last = +tl.dataset.last;
    ledgerPane.querySelectorAll('.tl-row[data-span]').forEach(r => r.classList.toggle('tight', +r.dataset.span / last * w < 36));
  }
  addEventListener('resize', () => { if (!ledgerPane.hidden) tightenTimeline(); });
  ledgerPane.addEventListener('click', e => {
    const tg = e.target.closest('[data-act="closed"]');
    if (tg) { state.showClosed = !tg.textContent.includes('숨기기'); renderLedger(); return; }   // 지금 보이면(숨기기 단추) 숨기고, 아니면 보인다
    const b = e.target.closest('.go'); if (!b) return;
    const i = +b.dataset.i; if (!state.flat[i]) return;
    unfoldTo(i);
    ta.focus(); selectLine(ta, state.flat[i].line); select(i, { toText: false, reveal: false });
  });

  // ── 그리기: 점검(인물 등장 · 비슷한 이름 · 같은 회차 제목) ──
  // 글자를 칠 때마다 다시 세면 느리니 멈추고 0.25초 뒤에 센다. 탭 숫자 = '확인' 개수('참고'는 빼고)
  const checkPane = $('#checkPane');
  let checkTimer = 0, checkData = null;
  function computeCheck() {
    const ap = MM.appearances(state.flat, state.structure, state.cast);
    const sim = MM.similarNames(state.cast.chars.map(c => c.name));
    const dup = MM.sameTitles(state.flat, state.structure);
    const issues = ap.filter(a => a.late).length + sim.filter(p => p.level === 'check').length + dup.length;
    return { ap, sim, dup, issues };
  }
  function scheduleCheck() { clearTimeout(checkTimer); checkTimer = setTimeout(updateCheck, 250); }
  function updateCheck() {
    clearTimeout(checkTimer);
    checkData = computeCheck();
    const b = $('#checkCount'); b.textContent = checkData.issues; b.hidden = !checkData.issues;
    if (state.mode === 'check') renderCheck();
  }
  function renderCheck() {
    const { ap, sim, dup, issues } = checkData || computeCheck();
    if (!state.cast.chars.length && !state.flat.length) {
      checkPane.innerHTML = `<div class="ledger-empty">${ICON.mochi}<div><p><b>점검할 것이 아직 없어요</b></p><p>왼쪽 플롯을 쓰고 <b>인물 지도</b> 탭에 인물을 적으면, 인물마다 플롯에 처음 · 마지막으로 나온 화와 비슷한 이름 · 같은 회차 제목이 여기 모여요.</p></div></div>`;
      return;
    }
    const go = p => { if (!p) return '<span class="muted">—</span>'; const full = placeName(p.i); return `<button class="go" data-i="${p.i}" title="${esc(full)}">${esc(MM.shortDesc(full, 30))}</button>`; };
    const badge = lv => lv ? `<span class="state ${lv === 'check' ? 'warn' : 'note'}">${lv === 'check' ? '확인' : '참고'}</span>` : '';
    const seen = ap.filter(a => a.count);
    const quiet = seen.filter(a => a.quiet > 0).sort((a, b) => b.quiet - a.quiet)[0];
    const card = (cls, k, v, sub = '') => `<div class="card ${cls}"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
    const cards = card('closed', '플롯에 나온 인물', `${seen.length}<small>/ ${ap.length}명</small>`) +
      card(issues ? 'warn' : 'open', '확인할 것', `${issues ? ICON.q : ''}${issues}<small>개</small>`, '관계보다 늦은 등장 · 헷갈리는 이름 · 같은 제목') +
      card('oldest', '가장 오래 안 나온 인물', quiet ? esc(quiet.name) : '—', quiet ? `마지막 등장 뒤 ${quiet.quiet}화` : '모두 마지막 화까지 나와요');
    const apRows = ap.map(a => {
      const also = [...a.words.slice(1), ...(a.given ? [a.given] : [])];
      const lv = a.late ? 'check' : !a.count ? 'note' : null;
      const memo = !a.count ? '플롯에 안 나와요 — 부르는 이름이 다르면 인물 줄에 <code>이름(부르는 이름)</code>으로 적어 주세요'
        : a.late ? `관계는 ${a.relStart}화부터인데 플롯에는 ${a.first.ep}화에 처음 나와요`
        : a.quiet > 0 ? `마지막 등장 뒤 ${a.quiet}화째 안 나와요` : a.quiet === 0 ? '마지막 화까지 나와요' : '';
      return `<tr><td>${badge(lv)}</td><td class="name">${esc(a.name)}${also.length ? `<span class="also" title="이 이름으로 나온 곳도 셉니다">+ ${esc(also.join(' · '))}</span>` : ''}</td><td>${go(a.first)}</td><td>${go(a.count > 1 ? a.last : null)}</td><td>${a.count ? a.eps + '화' : '—'}</td><td class="muted">${memo}</td></tr>`;
    }).join('');
    const simRows = sim.map(p => `<tr><td>${badge(p.level)}</td><td class="name">${esc(p.a)} · ${esc(p.b)}</td><td class="muted">${esc(p.why)}</td></tr>`).join('');
    const dupRows = dup.map(d => `<tr><td>${badge('check')}</td><td class="name">${esc(d.title)}</td><td>${d.places.map(go).join(' · ')}</td></tr>`).join('');
    checkPane.innerHTML = `<div class="ledger-wrap"><div class="cards">${cards}</div>` +
      `<section class="box list"><h2>인물 등장 <span>플롯 줄에 이름이 나온 곳 · 장소를 누르면 그 줄로</span></h2>` +
      (ap.length ? `<div class="tbl-scroll"><table class="ledger appear"><thead><tr><th></th><th>인물</th><th>처음</th><th>마지막</th><th>나온 화</th><th>메모</th></tr></thead><tbody>${apRows}</tbody></table></div>` : '<div class="empty-row">인물 지도 탭에 인물을 적으면 여기 나와요</div>') + '</section>' +
      `<section class="box names"><h2>비슷한 이름 <span>인물 칸에 적은 이름끼리 비교</span></h2>` +
      (simRows ? `<table class="ledger"><tbody>${simRows}</tbody></table>` : '<div class="empty-row">헷갈릴 만한 이름이 없어요</div>') +
      '<p class="box-note">단역 이름도 비교하려면 인물 칸에 한 줄씩 적어 두세요. ‘참고’는 이름 첫 글자만 같은 것이라 가족이면 그대로 둬도 돼요.</p><div style="height:12px"></div></section>' +
      `<section class="box titles"><h2>같은 회차 제목 <span>꼬리표를 뺀 화 제목이 같은 곳</span></h2>` +
      (dupRows ? `<table class="ledger"><tbody>${dupRows}</tbody></table>` : '<div class="empty-row">같은 제목의 화가 없어요</div>') + '</section></div>';
  }
  checkPane.addEventListener('click', e => {
    const b = e.target.closest('.go'); if (!b) return;
    const i = +b.dataset.i; if (!state.flat[i]) return;

    ta.focus(); selectLine(ta, state.flat[i].line); select(i, { toText: false, reveal: false });
  });

  // ── 찾아 바꾸기: 플롯 · 인물 · 메모에서 글자 그대로 한꺼번에(인물 이름 바꾸기용). 되돌리기 한 번으로 돌아간다 ──
  const findBox = $('#findBox'), findFrom = $('#findFrom'), findTo = $('#findTo');
  const AREAS = { plot: ['플롯', () => ta], cast: ['인물', () => castTa], memo: ['메모', () => memoTa] };
  const findScopes = () => [...findBox.querySelectorAll('.find-scope input:checked')].map(c => c.value);
  $('#findLead').textContent += ` 바꾼 뒤 ${KEYS.undo} 한 번이면 돌아가요.`;
  function openFind() {
    const area = state.mode === 'cast' ? castTa : ta;
    const sel = area.value.slice(area.selectionStart, area.selectionEnd).trim();
    if (sel && !sel.includes('\n') && [...sel].length <= 40) { findFrom.value = sel; findTo.value = ''; }
    findBox.hidden = false; findFrom.focus(); findFrom.select(); updateFind();
  }
  function closeFind() { findBox.hidden = true; }
  function updateFind() {
    const q = findFrom.value, info = $('#findInfo');
    if (!q) { info.innerHTML = '<span class="muted">찾을 말을 적으면 몇 곳인지 먼저 보여 드려요.</span>'; $('#findGo').disabled = true; return; }
    let total = 0; const parts = [], samples = [];
    findScopes().forEach(k => {
      const [label, el] = AREAS[k], ls = MM.findLines(el().value, q), n = ls.reduce((m, l) => m + l.count, 0);
      total += n; parts.push(`${label} ${n}곳`);
      ls.slice(0, 3).forEach(l => samples.push({ label, text: l.text.trim() }));
    });
    const mark = t => esc(t).split(esc(q)).join(`<mark>${esc(q)}</mark>`);
    const inside = state.cast.chars.map(c => c.name).filter(n => n !== q && n.includes(q));   // '만석'을 바꾸면 '진만석'도 바뀐다
    info.innerHTML = `<b>${parts.length ? parts.join(' · ') : '바꿀 곳(플롯 · 인물 · 메모)을 골라 주세요'}</b>` +
      (inside.length ? `<p class="find-warn">인물 ‘${esc(inside.join('’ · ‘'))}’ 이름 안에도 이 글자가 들어 있어 함께 바뀌어요</p>` : '') +
      (samples.length ? `<ul>${samples.slice(0, 6).map(x => `<li><span class="muted">${x.label}</span> ${mark(x.text)}</li>`).join('')}</ul>` : '') +
      (total && !findTo.value ? '<p class="muted" style="margin:6px 0 0">바꿀 말을 적으면 바꿀 수 있어요(지우기는 안 해요).</p>' : '');
    $('#findGo').disabled = !total || !findTo.value || findTo.value === q;
  }
  function doFind() {
    const q = findFrom.value, r = findTo.value;
    if (!q || !r || q === r || $('#findGo').disabled) return;
    const sc = findScopes().map(k => AREAS[k][1]()), res = sc.map(el => MM.replaceAll(el.value, q, r));
    const total = res.reduce((m, x) => m + x.count, 0);

    commit(); syncCast(); syncFromText(false); save();
    closeFind();

  }
  $('#findBtn').onclick = openFind;
  $('#findClose').onclick = closeFind;
  $('#findGo').onclick = doFind;
  findFrom.addEventListener('input', updateFind); findTo.addEventListener('input', updateFind);
  findBox.querySelectorAll('.find-scope input').forEach(c => c.addEventListener('change', updateFind));
  findBox.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;              // 한글 조합 중 Enter는 글자 확정
    if (e.key === 'Escape') { e.preventDefault(); closeFind(); }

  });
  findBox.addEventListener('pointerdown', e => { if (e.target === findBox) closeFind(); });

  // ── 아래 줄 숫자 ──
  function updateStats() {
    let s;
    if (state.mode === 'memo') {
      const v = memoTa.value, chars = [...v.replace(/\s/g, '')].length;
      s = chars ? `메모 ${chars.toLocaleString('ko-KR')}자 · ${v.split('\n').length}줄` : '메모가 비어 있어요';
    } else if (state.mode === 'cast') {
      const { chars, rels } = state.cast;
      s = chars.length ? `인물 ${chars.length}명 · 관계 ${rels.length}개` : '인물 없음';
      if (state.at != null && rels.length) {
        s += ` · ${state.at}화 시점 관계 ${rels.filter(r => MM.activeAt(r, state.at)).length}개`;
        const hid = state.hideOff ? chars.length - MM.castAt(state.cast, state.at, { hideChars: true }).chars.length : 0;
        if (hid) s += ` · 그때 관계가 없는 인물 ${hid}명 숨김`;
      }
    } else if (!state.flat.length) s = '아직 칸이 없습니다 — 왼쪽에 한 줄씩 적어 보세요';
    else {
      const counts = new Map();
      state.flat.forEach(n => { const k = MM.levelName(state.structure, n.depth); counts.set(k, (counts.get(k) || 0) + 1); });
      s = [...counts].map(([k, c]) => `${k} ${c}`).join(' · ');
      const eps = state.deco.filter(d => d.epNo).length;
      if (eps && state.target) s += ` · 예상 ${(eps * state.target).toLocaleString('ko-KR')}자 (회당 ${state.target.toLocaleString('ko-KR')}자)`;
    }
    $('#stats').textContent = s;
  }

  // ── 선택: 그림 ⇄ 글 ──
  function select(i, { toText = true, reveal = true } = {}) {
    selected = i; markSelected();
    if (toText && i >= 0 && state.flat[i]) selectLine(ta, state.flat[i].line);
    if (reveal) revealNode(i);
  }
  function selectLine(area, line) {
    const lines = area.value.split('\n');
    let start = 0; for (let k = 0; k < line; k++) start += lines[k].length + 1;
    const raw = lines[line] || '';
    const lead = raw.match(/^[ \t]*(?:[-*+•]\s+)?/)[0].length;
    area.setSelectionRange(start + lead, start + raw.replace(/\s+$/, '').length);
    const top = line * LINE_H;
    if (top < area.scrollTop || top > area.scrollTop + area.clientHeight - LINE_H * 2) area.scrollTop = Math.max(0, top - area.clientHeight / 3);
  }
  const caretLine = area => area.value.slice(0, area.selectionStart).split('\n').length - 1;
  function selectFromCaret() {
    const i = state.lineToIndex[caretLine(ta)] ?? -2;
    if (i !== selected) select(i, { toText: false });
  }
  function revealNode(i) {
    const n = state.mode === 'plot' && (nodeBox(i) || (i >= 0 && nodeBox(anchorOf(i)))); if (!n) return;
    const l = (PAD + n.x) * zoom, t = (PAD + HEAD + n.y) * zoom, r = l + n.w * zoom, b = t + n.h * zoom, m = 24;
    if (l < pane.scrollLeft + m || r > pane.scrollLeft + pane.clientWidth - m) pane.scrollLeft = Math.max(0, l - pane.clientWidth / 3);
    if (t < pane.scrollTop + m || b > pane.scrollTop + pane.clientHeight - m) pane.scrollTop = Math.max(0, t - pane.clientHeight / 3);
  }
  function pickCastLine(line) {
    state.castHi = line; markCast();
    if (line != null) selectLine(castTa, line);
  }

  // ── 이름 고치기 (한글 조합 입력 안전) ──
  // Chrome · Firefox: 조합 중 Enter → keydown(isComposing) → compositionend 순서. 조합이 끝난 뒤에 확정한다.
  // Safari: compositionend → keydown(Enter, keyCode 229, isComposing false) 순서. 이미 끝났으니 바로 확정한다.
  let editing = null;
  function startEdit(i, isNew = false) {
    const n = nodeBox(i); if (!n || i < -1) return;
    editing = { i, isNew, original: i < 0 ? state.site : state.flat[i].text, enterWhileComposing: false };
    editor.value = i < 0 ? state.site : state.flat[i].text;
    Object.assign(editor.style, {
      left: (PAD + n.x) * zoom + 'px', top: (PAD + HEAD + n.y) * zoom + 'px',
      width: Math.max(n.w + 40, 200, i >= 0 ? Math.min(480, mNode(state.flat[i].text) + 40) : 0) * zoom + 'px', height: n.h * zoom + 'px', fontSize: 14 * zoom + 'px',
    });
    editor.hidden = false; editor.focus(); editor.select();
  }
  function commitEdit() {
    if (!editing) return;
    const { i, original } = editing; editing = null; editor.hidden = true;
    const v = editor.value.replace(/\s+/g, ' ').trim();
    if (v && v !== original) {
      if (i < 0) { pushHistory(); state.site = v; siteInput.value = v; fitSite(); commit(); render(); save(); select(-1); }
      else applyOp(MM.rename(state.flat, i, v));
    }
    pane.focus({ preventScroll: true });
  }
  function cancelEdit() {
    if (!editing) return;
    const wasNew = editing.isNew; editing = null; editor.hidden = true;
    if (wasNew) undo();              // 방금 추가한 칸을 취소하면 추가도 되돌린다
    pane.focus({ preventScroll: true });
  }
  editor.addEventListener('keydown', e => {
    e.stopPropagation();

  });

  editor.addEventListener('pointerdown', e => e.stopPropagation());

  const newText = depth => '새 ' + MM.levelName(state.structure, depth);
  function addAndEdit(res) { if (applyOp(res)) { unfoldTo(res.sel); startEdit(res.sel, true); } }

  // ── 그림: 키보드 ──
  pane.addEventListener('keydown', e => {
    if (e.target === editor) return;
    flushDraw();
    const mod = e.metaKey || e.ctrlKey, i = selected, f = state.flat;
    if (mod && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key === 'y') { e.preventDefault(); redo(); return; }
    if (mod || state.mode !== 'plot') return;
    let handled = true;
    switch (e.key) {
      case 'Enter': if (i >= -1) addAndEdit(i < 0 ? MM.addChild(f, -1, newText(0)) : MM.addSibling(f, i, newText(f[i].depth))); break;
      case 'Tab': if (!e.shiftKey && i >= -1) addAndEdit(MM.addChild(f, i, newText(i < 0 ? 0 : f[i].depth + 1))); break;
      case 'F2': case ' ': if (i >= -1) startEdit(i); break;

  // ── 그림: 누르기 · 끌어 옮기기 · 화면 밀기 ──
  let drag = null, pan = null;
  const nodeAt = (x, y) => { const el = document.elementFromPoint(x, y); const g = el && el.closest && el.closest('#map .node'); return g ? +g.dataset.i : null; };
  const castLineAt = (x, y) => { const el = document.elementFromPoint(x, y); const g = el && el.closest && el.closest('#castMap [data-line]'); return g ? +g.dataset.line : null; };
  function clearDrop() {

  }
  function showDrop(t, pos) {

    if (pos === 'child') { svg.querySelector(`.node[data-i="${t}"]`)?.classList.add('drop-child'); return; }

    svg.insertAdjacentHTML('beforeend', `<rect id="dropMark" x="${PAD + n.x}" y="${y}" width="${n.w}" height="3" rx="1.5"/>`);
  }
  function dropTarget(e) {
    const t = nodeAt(e.clientX, e.clientY);
    if (t === null) return null;
    if (t >= drag.i && t < MM.subtreeEnd(state.flat, drag.i)) return null;   // 자기 자신 · 자기 하위에는 못 놓는다
    if (t < 0) return { t, pos: 'child' };
    const r = svg.querySelector(`.node[data-i="${t}"] > rect.bx`).getBoundingClientRect();
    const ry = (e.clientY - r.top) / r.height;
    return { t, pos: ry < 0.3 ? 'before' : ry > 0.7 ? 'after' : 'child' };
  }
  pane.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    flushDraw();
    const fold = state.mode === 'plot' && e.target.closest && e.target.closest('#map .fold');
    if (fold) { e.preventDefault(); toggleFold(+fold.dataset.i); return; }
    pane.focus({ preventScroll: true });
    const i = state.mode === 'plot' ? nodeAt(e.clientX, e.clientY) : null;
    if (i !== null) { drag = { i, x: e.clientX, y: e.clientY, moving: false, target: null }; }
    else {
      const hit = state.mode === 'cast' ? castLineAt(e.clientX, e.clientY) : null;
      pan = { x: e.clientX, y: e.clientY, sl: pane.scrollLeft, st: pane.scrollTop, hit };

  });
  pane.addEventListener('pointermove', e => {
    if (pan) { pane.scrollLeft = pan.sl - (e.clientX - pan.x); pane.scrollTop = pan.st - (e.clientY - pan.y); return; }
    if (!drag || drag.i < 0) return;

    drag.target = dropTarget(e);

  });
  pane.addEventListener('pointerup', e => {
    if (pan) {

      return;
    }
    if (!drag) return;
    const d = drag; drag = null; clearDrop();
    if (d.moving) { if (d.target) applyOp(MM.moveTo(state.flat, d.i, d.target.t, d.target.pos)); }
    else select(d.i);
  });
  pane.addEventListener('pointercancel', () => { drag = null; pan = null; pane.classList.remove('panning'); clearDrop(); });
  pane.addEventListener('dblclick', e => { if (state.mode !== 'plot') return; const i = nodeAt(e.clientX, e.clientY); if (i !== null) startEdit(i); });

  // ── 확대 · 축소 ──
  function setZoom(z) {
    z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(z * 100) / 100));
    if (state.mode === 'cast') { castZoom = z; renderCast(); } else { zoom = z; render(); }
  }
  $('#zoomIn').onclick = () => setZoom(curZoom() * 1.2);
  $('#zoomOut').onclick = () => setZoom(curZoom() / 1.2);
  $('#zoomLabel').onclick = () => setZoom(1);
  $('#zoomFit').onclick = () => {
    const W = state.mode === 'cast' ? CL.width + PAD * 2 : L.width + PAD * 2, H = state.mode === 'cast' ? CL.height + PAD * 2 : L.height + PAD * 2 + HEAD;
    setZoom(Math.min(1, (pane.clientWidth - 8) / W, (pane.clientHeight - 8) / H));
  };
  pane.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(curZoom() * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); } }, { passive: false });

  // ── 글 칸: 플롯 ──
  ta.addEventListener('input', e => {
    if (!e.isComposing && e.inputType === 'insertLineBreak') {   // 새 줄은 윗줄 들여쓰기를 따라간다
      const pos = ta.selectionStart, prevStart = ta.value.lastIndexOf('\n', pos - 2) + 1;
      const ws = ta.value.slice(prevStart, pos - 1).match(/^[ \t]*/)[0];
      if (ws) ta.setRangeText(ws, pos, pos, 'end');
    }

    syncFromText(true, true);
  });
  function undoKeys(e) {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); e.shiftKey ? redo() : undo(); return true; }
    if (mod && e.key === 'y') { e.preventDefault(); redo(); return true; }

  }
  ta.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;              // 한글 조합 중에는 건드리지 않는다
    if (undoKeys(e)) return;

  });
  function shiftLines(dir) {
    const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
    const a = v.lastIndexOf('\n', s - 1) + 1;
    let b = v.indexOf('\n', en > s && v[en - 1] === '\n' ? en - 1 : en); if (b < 0) b = v.length;
    const lines = v.slice(a, b).split('\n');

    const next = lines.map((ln, k) => {

      else out = ln.startsWith('\t') ? ln.slice(1) : ln.replace(/^ {1,2}/, '');
      const d = out.length - ln.length; if (k === 0) firstDelta = d; total += d; return out;
    }).join('\n');

    pushHistory();
    ta.value = v.slice(0, a) + next + v.slice(b); commit();

    syncFromText();
  }

  // 엑셀 · 구글 시트 표를 붙이면 기획(부 › 화 › 장면)으로 바꿔 넣는다. ⌘Z 한 번으로 돌아간다
  ta.addEventListener('paste', e => {
    const text = e.clipboardData && e.clipboardData.getData('text/plain');
    const t = text && MM.tableToOutline(text);
    if (!t) return;
    e.preventDefault();
    const whole = !ta.value.trim() || (ta.selectionStart === 0 && ta.selectionEnd === ta.value.length);
    const before = state.structure;
    let flat = t.flat, structure = before;
    if (t.header && !t.hasPart && structure === '부화장면') { if (whole) structure = '화장면'; else flat = flat.map(n => ({ depth: n.depth + 1, text: n.text })); }
    if (t.header && t.hasPart && structure === '화장면' && whole) structure = '부화장면';
    let insert = MM.serialize(flat, MM.epDepth(structure));
    const a = ta.selectionStart, b = ta.selectionEnd;
    if (a > 0 && ta.value[a - 1] !== '\n') insert = '\n' + insert;
    if (b < ta.value.length && ta.value[b] !== '\n') insert += '\n';
    pushHistory();
    if (structure !== state.structure) { state.structure = structure; structSel.value = structure; buildFoldBar(); }
    ta.setRangeText(insert, a, b, 'end');
    commit(); syncFromText();
    toast(`표 ${t.rows}줄을 기획으로 바꿨어요 — 칸 ${flat.length}개${structure !== before ? ` · "${MM.STRUCTURES[structure].label}" 구조로 바꿈` : ''}. 되돌리려면 ${KEYS.undo}`);
  });
  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast'); el.innerHTML = `${ICON.mochi}<span>${esc(msg)}</span>`; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
  }

  // ── 글 칸: 인물 ──
  castTa.addEventListener('input', () => { noteTyping(); syncCast(); });
