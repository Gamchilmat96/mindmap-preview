    const st = TUT[tut.i];
    if (tutChecks()[st.id]) { tut.i++; renderTut(true); }
    else { const t = st.target(); if (t && !t.classList.contains('tut-focus')) tutFocus(t); }
  }
  function startTutorial() {
    const snap = { ...current(), folds: [...state.folded] };
    try { localStorage.setItem(TKEY, JSON.stringify(snap)); } catch (e) { /* 이 창 안에서는 그대로 동작 */ }
    tut = { i: 0, snap, startedAt: Date.now(), timer: 0 };
    setDoc({ site: '연습 작품', text: '', cast: '', memo: '', structure: '부화장면', target: 5000 });
    state.folded = new Set(); render(); setMode('plot');
    renderTut();
    updateWelcome();
    tut.timer = setInterval(tutTick, 400);
    ta.focus();
  }
  function endTutorial(choice) {
    const snap = tut ? tut.snap : (() => { try { return JSON.parse(localStorage.getItem(TKEY)); } catch (e) { return null; } })();
    clearInterval(tut && tut.timer); tut = null; tutFocus(null); tutEl.hidden = true; updateWelcome();
    try { localStorage.removeItem(TKEY); } catch (e) { /* 무시 */ }
    if (choice === 'restore' && snap && typeof snap.text === 'string') {
      setDoc({ site: snap.site || '', text: snap.text, cast: snap.cast || '', memo: snap.memo || '', structure: snap.structure, target: snap.target });
      state.folded = new Set(Array.isArray(snap.folds) ? snap.folds : []); render(); save();
      toast('원래 작품으로 돌아왔어요');
    } else if (choice === 'example') { setDoc(EXAMPLE); toast('예시 작품 「검을 버린 막내」예요. 세 탭을 둘러보세요'); }
    setMode('plot');
  }
  tutEl.addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    const a = b.dataset.t;
    if (a === 'demo') { TUT[tut.i].demo(); setTimeout(tutTick, 50); }
    else if (a === 'skip') { tut.i++; renderTut(); }
    else if (a === 'stop') { tut.i = TUT.length; renderTutEnd(true); }
    else endTutorial(a);
  });
  $('#tutBtn').onclick = () => { if (tut) return; startTutorial(); };
  $('#welcome').addEventListener('click', e => {
    const b = e.target.closest('[data-w]'); if (!b) return;
    if (b.dataset.w === 'tut') { if (!tut) startTutorial(); }
    else if (b.dataset.w === 'example') guardReplace('예시 불러오기', () => { setDoc(EXAMPLE); setMode('plot'); });
    else if (b.dataset.w === 'open') guardReplace('파일 불러오기', () => $('#fileInput').click());
  });

  // ── 시작 ──
  if (document.fonts) {
    let fontTimer = 0;
    const redraw = () => { clearTimeout(fontTimer); fontTimer = setTimeout(() => { clearWidths(); fitSite(); if (!editing) { render(); renderCast(); } }, 60); };
    document.fonts.addEventListener('loadingdone', redraw);
    document.fonts.ready.then(redraw);
  }
  let saved = load();
  let staleExample = false;
  if (saved && MM.sameAsExample(saved, EXAMPLE)) { saved = null; staleExample = true; }   // 예전 판이 저절로 저장한 예시는 빈 작품으로(TROUBLESHOOTING 18)
  if (saved && Array.isArray(saved.folds)) state.folded = new Set(saved.folds.filter(k => typeof k === 'string'));
  // 처음 온 사람은 빈 작품에서 시작한다(2026-11-25 사용자 "초기화된 상태에서 이용가능한 서비스로"). 예시는 위쪽 "예시" 단추로
  applyDoc({ site: '', text: '', cast: '', memo: '', structure: MM.DEFAULT_STRUCTURE, target: 5000, ...(saved || {}) });
  setMode(saved && ['plot', 'cast', 'ledger', 'check', 'memo'].includes(saved.mode) ? saved.mode : 'plot');
  buildFoldBar();
  setWrap(!(saved && saved.wrap === false));
  if (saved && saved.leftW > 0) setLeftW(saved.leftW, false);
  syncOffBtn();
  bk = loadBackup();
  if (!bk || staleExample) { bk = { at: bk ? bk.at : null, sig: docSig(), dirtySince: null, snooze: '' }; saveBackup(); }   // 빈 작품을 '바뀐 것 없음' 기준으로   // 처음 연 글(예시 등)은 '바뀐 것 없음'에서 시작
  checkDirty();
  setInterval(updateBackupUI, 5 * 60e3);
  (() => {
    let pending = null;
    try { pending = JSON.parse(localStorage.getItem(TKEY)); } catch (e) { /* 무시 */ }
    if (pending && typeof pending.text === 'string') {        // 따라 하기 도중에 창을 닫았다
      tut = null;
      tutEl.innerHTML = `<div class="tut-head">${ICON.mochi}<div><span class="tut-step">따라 하기를 하다 멈췄어요</span><b>쓰던 작품으로 돌아갈까요?</b></div></div>` +
        '<p>지금 화면은 연습 작품이에요. 따라 하기 전에 쓰던 작품은 따로 보관해 두었어요.</p>' +
        '<div class="tut-btns"><button data-t="restore">원래 작품으로</button><button data-t="keep" class="ghost">지금 그대로 두기</button></div>';
      tutEl.hidden = false;
    }
  })();
  updateUndoButtons();

  // 검사용 (qa에서 읽는다)
  window.__mm = {
    state, hist, select, undo, redo, setMode,
    get selected() { return selected; }, get zoom() { return zoom; }, get castZoom() { return castZoom; }, get L() { return L; }, get CL() { return CL; },
  };
})();
</script>
</body>
</html>
